<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mihai · 18 ani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --white:#fffefb; --cream:#faf4e4; --gold-soft:#efdfb0; --gold:#c9a24a; --gold-deep:#8f6d1f; --ink:#2b2110; --muted:#7a6a4a;
  --gold-grad:linear-gradient(135deg,#e9cf84 0%,#c9a24a 45%,#a37a22 100%);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--white);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;display:flex;flex-direction:column;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
.notice{display:none;background:var(--gold-soft);text-align:center;padding:.7rem 1.2rem;padding-top:calc(.7rem + env(safe-area-inset-top,0px));font-size:.92rem;font-weight:400}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(100deg,var(--cream),var(--white) 70%)}
.txt{display:flex;flex-direction:column;justify-content:center;padding:clamp(2rem,6vw,6rem)}
.kicker{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,2.4vw,1.8rem);color:var(--gold-deep)}
h1{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(4.6rem,15vw,12rem);line-height:.88;letter-spacing:-.02em}
.age{font-family:var(--serif);font-weight:500;font-size:clamp(5rem,14vw,11rem);line-height:.9;color:var(--gold);background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:.3rem}
.rule{width:5rem;height:2px;background:var(--gold-grad);margin:1.6rem 0}
.txt p{max-width:26rem;color:var(--muted);font-size:1.05rem}
.go{align-self:flex-start;margin-top:2rem;font-weight:400;color:var(--ink);background:var(--gold-grad);padding:.9rem 2rem;border-radius:999px;text-decoration:none;transition:filter .2s}
.go:hover{filter:brightness(1.08)}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.small{margin-top:1rem!important;font-size:.9rem!important}
.pic{background:var(--gold-soft);min-height:60vh}
.pic img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
@media (max-width:760px){main{grid-template-columns:1fr}.pic{order:-1;min-height:55vh}.txt{padding:2rem 1.5rem 3rem}}
</style>
</head>
<body>

<div class="notice" id="notice"></div>

<main>
  <div class="txt">
    <span class="kicker">La mulți ani!</span>
    <h1>Mihai</h1>
    <div class="age">18</div>
    <div class="rule"></div>
    <p>Toate fotografiile sunt într-un singur fișier zip. Apasă butonul și le descarci pe toate odată.</p>
    <a class="go" id="dl" href="#">Descarcă toate pozele (zip)</a>
    <p class="small" id="small"></p>
  </div>
  <div class="pic"><img src="mihai.jpg" alt="Mihai" onerror="this.remove()"></div>
</main>

<script>
/* ===== SETĂRI ===== */
const CLOSE_DATE = "2026-11-20";   // data de închidere (AAAA-LL-ZZ). Lasă gol dacă site-ul nu e temporar.
const ZIP_URL    = "https://drive.google.com/drive/folders/1IukDliKoJfqy0E7VRJzJ6tPG86cn7TI4?usp=drive_link";   // linkul către zip
/* ================== */

const small = document.getElementById("small");
if (CLOSE_DATE) {
  const close = new Date(CLOSE_DATE + "T23:59:59");
  const days = Math.max(0, Math.ceil((close - new Date()) / 864e5));
  const dateRo = close.toLocaleDateString("ro-RO", {day:"numeric", month:"long", year:"numeric"});
  const n = document.getElementById("notice"); n.style.display = "block";
  n.textContent = "Acest site este temporar și se va închide pe " + dateRo +
    (days > 0 ? " (mai sunt " + days + (days === 1 ? " zi" : " zile") + ")" : "") +
    ". Te rugăm să-ți descarci pozele până atunci.";
  small.textContent = "Linkul rămâne activ până pe " + dateRo + ".";
}
const dl = document.getElementById("dl");
if (ZIP_URL) { dl.href = ZIP_URL; }
else { dl.style.display = "none"; small.textContent = "Linkul de descărcare va fi adăugat în curând."; }
</script>
</body>
</html>
